services:
  postgres:
    image: postgres:16
    container_name: scannext-postgres
    environment:
      POSTGRES_USER: scannext
      POSTGRES_PASSWORD: scannext
      POSTGRES_DB: scannext
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: scannext-redis
    ports:
      - "6379:6379"

  api-gateway:
    image: node:22-alpine
    container_name: scannext-api-gateway
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/api-gateway:/app
    environment:
      PORT: 8080
      POSTGRES_URL: postgres://scannext:scannext@postgres:5432/scannext?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  web:
    image: node:22-alpine
    container_name: scannext-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./apps/web:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

  asset-scanner:
    image: golang:1.23-alpine
    container_name: scannext-asset-scanner
    working_dir: /app
    command: sh -c "go run ./cmd/server"
    volumes:
      - ./services/asset-scanner:/app
    environment:
      PORT: 8090
    ports:
      - "8090:8090"

  rule-engine:
    image: golang:1.23-alpine
    container_name: scannext-rule-engine
    working_dir: /app
    command: sh -c "go run ./cmd/server"
    volumes:
      - ./services/rule-engine:/app
    environment:
      PORT: 8091
    ports:
      - "8091:8091"

volumes:
  pgdata:
